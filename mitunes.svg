      <stop offset="0" stop-color="#1c1c1f"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="nota" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6fa8"/>
